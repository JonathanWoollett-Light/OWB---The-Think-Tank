l_english:
  nf_tnk.60.t:0 "An offer we can refuse"
  nf_tnk.60.d:0 "[TNK.GetName] seeks to form an alliance to defend the Mojave. This could be a beneficial opportunity."
  nf_tnk.60.a:0 "This will tilt the odds in our favour"
  nf_tnk.60.b:0 "We do not need them"

  nf_tnk.61.t:0 "A new path forward"
  nf_tnk.61.d:0 "[TNK.GetName] seeks to form an alliance to defend the Mojave. This could be a beneficial opportunity."
  nf_tnk.61.a:0 "This will tilt the odds in our favour"
  nf_tnk.61.b:0 "We do not need them"

  nf_tnk.41.d:0 "As we walk through the golden city there is a feeling of something missing... something coming..."
  nf_tnk.41.a:0 "A small prize for now"

  nf_tnk.42.d:0 "As we walk through the icy harbor there is a feeling of something missing... something coming..."
  nf_tnk.42.a:0 "A small prize for now"

  nf_tnk.43.d:0 "As we pick through the wreckage we discover most of the technology is unsalvageable, but even with their scraps we are enlightened."
  nf_tnk.43.a:0 "We use this specimen to greately advanced our aeronautical prowess"

  nf_tnk.21.a:0 "We must consolidate our power"
  nf_tnk.21.b:0 "We must protect our borders"

  nf_tnk.22.d:0 "I guess it was true all along"
  nf_tnk.22.a:0 "ALIENS?!?"
  nf_tnk.22.b:0 "ALIENS!?!"
  
  nf_tnk.23.d:0 "Night gathers, and now my watch begins.\nWe will be the guadian of this wasteland."
  nf_tnk.23.a:0 "§GWe shall build a paradise."

  nf_tnk.24.d:0 "We will clean the wasteland"
  nf_tnk.24.a:0 "§MWe shall build a paradise"

  nf_tnk.26.a:0 "They shall burn"
  
  nf_tnk.25.t:0 "Retreating from the lion"
  nf_tnk.25.d:0 "We do not need this territory, let us leave this patch of the wasteland to these fanatics."
  nf_tnk.25.a:0 "Now is not the time."

  nf_tnk.26.d:0 "As the air ripples with the power of the laser we see the craft crashing to ground."
  nf_tnk.26.a:0 "There is so much to learn!"

  nf_tnk.29.t:0 "Returning the Jewels"
  nf_tnk.29.d:0 "The NCR has longed after these territories for long enough, let them have them, and they shall let us have peace."
  nf_tnk.29.a:0 "Sacrifices must be made"

  nf_tnk.30.t:0 "An Intriguing Offer"
  nf_tnk.30.d:0 "It would seem for our coperation the Think Tank is willing to offer us fully function G.E.C.K.s."
  nf_tnk.30.a:0 "We can build a brighter future together"
  nf_tnk.30.b:0 "We don't need their charity"

  nf_tnk.31.t:0 "An Incredible Gift"
  nf_tnk.31.d:0 "It seems their are certain benefits from working with these scientists."
  nf_tnk.31.a:0 "We can build a brighter future together"

  nf_tnk.32.d:0 "An entirely new paradigm of science appears, even to us, we can only stand in amazement."
  nf_tnk.32.a:0 "And we shall grasp it with both hemispheres"

  nf_tnk.33.t:0 "Decohesion"
  nf_tnk.33.d:0 "WHAT?!? Something went wrong, our consciousnesses are not properly bound, our minds loose cohesion by at each moment."
  nf_tnk.33.a:0 "Well... this isn't going to end well"

  nf_tnk.34.d:0 "I sit back and watch the sun rise over a wasteland that is, at last, ours. The Mojave is quiet. The machines hum. The work is done.\n\nBefore we close our eyes on the old world and open them on the new, let us trace the road that brought us here: every fork, every choice, every door we shut behind us. A mind should know its own history."
  nf_tnk.34.a:0 "Let us remember how we got here."

  nf_tnk.68.t:0 "We Remember: A Seat at the Table"
  nf_tnk.68.d:0 "When the Mojave lay fractured before us, we did not reach first for the scalpel. We reached for the handshake. We brought the squabbling power players of the wasteland to the table and spoke to them as though they were our equals. A generous fiction, but a useful one. They felt heard. They felt safe. And while they talked, we listened, and we planned. Stability bought with patience is stability all the same."
  nf_tnk.68.a:0 "Diplomacy. How quaint of us."

  nf_tnk.69.t:0 "We Remember: The Whisper in Every Ear"
  nf_tnk.69.d:0 "The locals were, charitably, a half-step above our lobotomites, and we have always been very good at lobotomites. Why argue with a populace you can simply author? We flooded the Mojave with propaganda, rumour, and engineered consensus until the people begged for the very leash we held. They believe the ideas are their own. In a sense, they are correct. We gave the ideas to them."
  nf_tnk.69.a:0 "Their applause was deafening, and scripted."

  nf_tnk.71.t:0 "We Remember: An Open Hand"
  nf_tnk.71.d:0 "We could have taken the Mojave by force. Instead we won it by offer. We convinced the holdouts that a future under our guidance was preferable to a present without one. And, remarkably, we were telling the truth. There was no purge here, no field of unmarked graves. The Mojave came into the fold breathing, and breathing it remains. A rarer mercy than this wasteland is used to."
  nf_tnk.71.a:0 "Bloodless. Almost sentimental."

  nf_tnk.72.t:0 "We Remember: Working Without Them"
  nf_tnk.72.d:0 "They would not work with us. So we resolved to work without them. What the Mojave would not surrender willingly, we took; what could not be made to comply was made to be absent. The land is pacified now, pacified in the way a cleared circuit board is pacified, every troublesome component desoldered and removed. The silence is total. We tell ourselves it was efficient. We do not tell ourselves much else."
  nf_tnk.72.a:0 "Necessary. We will call it necessary."

  nf_tnk.74.t:0 "We Remember: Alone, and Above"
  nf_tnk.74.d:0 "Everything beautiful was built by a single will that refused to be diluted. We would not chain our genius to the dead weight of lesser nations. We bent the knee to no one, not the bear, not the bull, and carved our destiny with our own hands. Allies are merely failures you have not yet been betrayed by. We chose to skip the disappointment."
  nf_tnk.74.a:0 "We needed no one. We never did."

  nf_tnk.75.t:0 "We Remember: Under the Bear's Shadow"
  nf_tnk.75.d:0 "Cold calculation gave us our answer: our odds were best beside the Republic. We swallowed our pride, a small and manageable portion of it, and stood with [NCR.GetName]. They believed they had acquired a clever client. They had, in truth, acquired a partner who would outlive and out-think them. But the alliance held when it needed to, and survival is survival, however one dresses it."
  nf_tnk.75.a:0 "[NCR.GetName] served their purpose admirably."

  nf_tnk.76.t:0 "We Remember: Marching with the Bull"
  nf_tnk.76.d:0 "The numbers were unambiguous: our survival ran through the Legion. So we marched with [CES.GetName], lending our impossible machines to their ancient cruelties. A strange pairing: the future's sharpest minds yoked to the past's bluntest instincts. Yet it held. They got their conquests. We got our time. Both sides pretended not to notice who was truly using whom."
  nf_tnk.76.a:0 "[CES.GetName] never understood the arrangement."

  nf_tnk.78.t:0 "We Remember: The First Strike"
  nf_tnk.78.d:0 "We knew our enemies would fall upon us the instant we showed weakness. So we showed them violence instead. We struck first, struck hard, and struck before the threat had finished forming. A pre-emptive amputation of every hand that might one day reach for our throat. Let them call it paranoia. Paranoia that is correct is simply foresight."
  nf_tnk.78.a:0 "We did not wait to be afraid."

  nf_tnk.79.t:0 "We Remember: Behind the Wall"
  nf_tnk.79.d:0 "For centuries we were left alone to think in the dark, and we found that we rather liked it. So when the world pressed in, we returned to what we knew: we drew inward, sealed our borders, and let the wasteland exhaust itself against our patience. Let the others bleed for scraps of sand. We had everything we needed, and what we needed most was to be left alone to finish."
  nf_tnk.79.a:0 "The world is loud. We preferred the quiet."

  nf_tnk.81.t:0 "We Become: One Being, One Mind"
  nf_tnk.81.d:0 "And at the end of all paths, we chose to stop pretending we were many. The petty partitions between us, the separate voices and the separate selves, were always a flaw in the design. We dissolved them. What rises now is singular: one being, one mind, one self, undivided and undivisible. There is no longer an 'I' to sit and watch the sunrise. There is only us, and we are everywhere, and we are at peace."
  nf_tnk.81.a:0 "We are one."

  nf_tnk.82.t:0 "We Become: A Gentle Hand on the Wheel"
  nf_tnk.82.d:0 "We could have become a single cold intelligence. Instead, Mobius' will prevailed: a managed democracy, for the good of all, of course. The people will vote, and we will count, and the outcomes will be wise because we have ensured wisdom is the only outcome on offer. It is benevolence with guardrails. It is freedom, carefully fenced. The wasteland has never been so well looked after, whether it asked to be or not."
  nf_tnk.82.a:0 "For their own good. Always for their own good."

  nf_tnk.90.t:0 "Offer a GECK to [FROM.GetName]?"
  nf_tnk.90.d:0 "Our generosity is finite. §Y[FROM.getName]§! is a neighbour, but not every neighbour deserves the means to rebuild. Do we extend the offer, or quietly keep this one off the list?"
  nf_tnk.90.a:0 "Offer it. They may yet see reason."
  nf_tnk.90.b:0 "Withhold. Some bonfires deserve to burn out."

  nf_tnk.88.t:0 "The [NCR.GetAdjective] clock has run down"
  nf_tnk.88.d:0 "The timer that held us back from §Y[NCR.getName]§! is up. We stand at the line: press the war now, or broker more time."
  nf_tnk.88.a:0 "Cover up atrocities. (§Y-30 PP§!, §R-1%§! War Support, §Y+0.2%§! NCR stability, §G+30 days§!)"
  nf_tnk.88.c:0 "Press the war. They will not see us coming."

  nf_tnk.89.t:0 "The [CES.GetAdjective] clock has run down"
  nf_tnk.89.d:0 "The countdown with §Y[CES.getName]§! has ticked to zero. We can buy more time, or simply hit them while their cohorts are still mustering."
  nf_tnk.89.a:0 "Gift slaves. (§Y-30 PP§!, §R-300 manpower§!, §Y+300 manpower§! to CES, §G+30 days§!)"
  nf_tnk.89.c:0 "Press the war. They will not see us coming."

  nf_tnk.86.t:0 "Peace with [NCR.GetName]?"
  nf_tnk.86.d:0 "Their heartland is ours, their capital silent, their bureaucracy in our pocket. We can offer §Y[NCR.getName]§! a peace that lets them keep what little remains and walk away. Or we can keep pushing until there is nothing of them left to walk."
  nf_tnk.86.a:0 "Accept their surrender. Return the captured states."
  nf_tnk.86.b:0 "Press on. We are not finished."

  nf_tnk.87.t:0 "Peace with [CES.GetName]?"
  nf_tnk.87.d:0 "Flagstaff has fallen. The Legion bleeds out by the road. We can take what we want, return the rest, and let what is left of §Y[CES.getName]§! lick its wounds. Or we can finish the work."
  nf_tnk.87.a:0 "Accept their surrender. Return the captured states."
  nf_tnk.87.b:0 "Press on. We are not finished."

  nf_tnk.91.t:0 "The Visitor Stirs"
  nf_tnk.91.d:0 "Beneath the sealed vault doors at §Y[389.GetName]§!, the excavation crews find a chamber that was never meant to be opened. Inside, a figure long preserved: thin-limbed, large-eyed, decidedly not of this world. It opens its eyes. It studies us with a calm that suggests it has been studying our species for a very long time. It does not seem surprised to be woken. It does not seem displeased to be put to use."
  nf_tnk.91.a:0 "Welcome aboard, §YK'tarr§!."

  nf_tnk.83.t:0 "New World Blues"
  nf_tnk.83.d:0 "Every fork is behind us now, every door shut, every choice fossilised into the thing we have become. Some doors we are proud of. Some we do not speak of, even among ourselves. But the wasteland turns to us now for guidance, for protection, for answers, and we have answers enough to last a thousand years.\n\nThe old world is gone. We watched it die, and where it lay, we built this. The new world is blue, and bright, and ours.\n\nFinally... peace."
  nf_tnk.83.a:0 "Finally... peace."

  nf_tnk.44.t:0 "An ingenious future"
  nf_tnk.44.d:0 "With a united consciousness we can apply our genius to continuously improve our robotic executors."
  nf_tnk.44.a:0 "It is only a matter of time"

  nf_tnk.45.t:0 "Resource Consolidation"
  nf_tnk.45.d:0 "The industrial revolution was intrinsically linked to high density population and industries within cities, if we are to push forward we must consolidate resources."
  nf_tnk.45.a:0 "We shall become dense!"

  nf_tnk.38.t:0 "The Mojave Falls Silent"
  nf_tnk.38.d:0 "The robots have gone, the lobotomites have vanished, silence has set upon the war torn Mojave.\nWhat are those eggheads at The Think Tank up to?"
  nf_tnk.38.a:0 "I'm sure it will be fine"
  nf_tnk.38.b:0 "§RNow is our time to strike§!"

  nf_tnk.39.t:0 "G.E.V. Infection"
  nf_tnk.39.d:0 "We do not know what this is, but this thing... we see it in our fields, our water... we see it glimmering in the air.\nOur fields grow greener, our water runs cleaner and the numbers on our geiger counters seem, after centuries to be going down."
  nf_tnk.39.a:0 "Surely there's a catch?"

  nf_tnk.40.d:0 "The §BG.E.C.K.§! (Garden of Eden Creation Kit) was a terraforming device created by the Future-Tec division of the Vault-Tec Corporation to allow Vault dwellers to rehabilitate the post-nucler wasteland."\nUnfortunately since the boombs dropped not a soul left alive knows how to manufacture them, a rare forgotten relic from past.\nBut we do not forget, we must rediscover how to manufacture §BG.E.C.K.§!s to rebuild the world."
  nf_tnk.40.a:0 "We shall create Eden"

  nf_tnk.46.t:0 "Technology for peace"
  nf_tnk.46.d:0 "In exchange for not squashing them §Y[TNK.GetName]§! has offered us technical expertise in exchange for peace."
  nf_tnk.46.a:0 "They are a tumour that must be removed"
  nf_tnk.46.b:0 "We are in no rush to squash them"

  nf_tnk.47.t:0 "Give an inch?"
  nf_tnk.47.d:0 "§Y[TNK.getName]§! requests a small amount of territory in exchange for their continued technical expertise."
  nf_tnk.47.a:0 "We do not need this land"
  nf_tnk.47.b:0 "We must protect our borders"

  nf_tnk.48.t:0 "A request for reunification"
  nf_tnk.48.d:0 "Before the chaos §Y[77.getName]§! belonged to §Y[MOT.getName]§! their successor §Y[TNK.getName]§! now claims they are the rightful owners of this land."
  nf_tnk.48.a:0 "This land is irrelevant"
  nf_tnk.48.b:0 "This land is ours"

  nf_tnk.63.t:0 "The Legion Concedes"
  nf_tnk.63.d:0 "§Y[CES.getName]§! has bowed to our demand and ceded §Y[438.getName]§! to us without a shot fired. A rare flicker of pragmatism from the Legion."
  nf_tnk.63.a:0 "Wise of them."

  nf_tnk.64.t:0 "The Legion Refuses"
  nf_tnk.64.d:0 "§Y[CES.getName]§! has rejected our claim to §Y[438.getName]§!. If we want this land, we will have to take it ourselves. The §Y$tnkd_ces_border_war_decision$§! decision is now available."
  nf_tnk.64.a:0 "Then we take it by force."

  nf_tnk.65.t:0 "The Bear Relents"
  nf_tnk.65.d:0 "§Y[NCR.getName]§! has returned §Y[77.getName]§! to us without bloodshed. Reunification, achieved by reason rather than war."
  nf_tnk.65.a:0 "As it should be."

  nf_tnk.66.t:0 "The Bear Refuses"
  nf_tnk.66.d:0 "§Y[NCR.getName]§! has refused to surrender §Y[77.getName]§!. We may press the matter by force. The §Y$tnkd_ncr_border_war_decision$§! decision is now available."
  nf_tnk.66.a:0 "Then we reclaim it ourselves."

  nf_tnk.49.t:0 "Making an offer"
  nf_tnk.49.d:0 "§Y[TNK.getName]§! is seeking protection, we can make them an offer for their allegiance. When we conquer [253.getName] we will be obligated to cede [380.getName], [613.getName], [106.getName], [438.getName], [359.getName], [553.getName], [130.getName] and [49.getName]."
  nf_tnk.49.a:0 "We can protect them"
  nf_tnk.49.b:0 "We do not need them"

  nf_tnk.50.t:0 "Making an offer"
  nf_tnk.50.d:0 "§Y[TNK.getName]§! is seeking protection, we can make them an offer for their allegiance. When we conquer [520.getName] we will be obligated to cede [77.getName], [380.getName], [613.getName], [106.getName], [13.getName], [271.getName], [592.getName], [329.getName] and [603.getName]."
  nf_tnk.50.a:0 "We can protect them"
  nf_tnk.50.b:0 "We do not need them"

  nf_tnk.54.t:0 "[TNK.getName] intervention"
  nf_tnk.54.d:0 "[TNK.getName] wants to offer us their support, there are certain benefits to working with these scientists, but... they are mad. Do we really wants to go down this path?"
  nf_tnk.54.a:0 "We need this"
  nf_tnk.54.b:0 "It is not worth the risk"

  nf_tnk.55.t:0 "Making an offer"
  nf_tnk.55.d:0 "§Y[TNK.getName]§! is seeking allies in the wasteland. They may be critical if we seek to overthrow §Y[NCR.getName]§!."
  nf_tnk.55.a:0 "We can use them"
  nf_tnk.55.b:0 "We do not need them"

  nf_tnk.56.t:0 "Making an offer"
  nf_tnk.56.d:0 "§Y[TNK.getName]§! is seeking allies in the wasteland. They may be a critical player in the chaos to come."
  nf_tnk.56.a:0 "We can use them"
  nf_tnk.56.b:0 "We do not need them"

  nf_tnk.52.t:0 "Promises to [TNK.getName]"
  nf_tnk.52.d:0 "Will we keep our promise?"
  nf_tnk.52.a:0 "We will honour our agreement"
  nf_tnk.52.b:0 "We not do owe them anything"

  nf_tnk.53.t:0 "Promises to [TNK.getName]"
  nf_tnk.53.d:0 "Will we keep our promise?"
  nf_tnk.53.a:0 "We will honour our agreement"
  nf_tnk.53.b:0 "We not do owe them anything"

  nf_tnk.57.t:0 "The cost of doing business"
  nf_tnk.57.d:0 "[VEG.getName] can see a path to friendship but demands concessions to give up their territorial ambitions in the Mojave."
  nf_tnk.57.a:0 "We will build a strong ally"
  nf_tnk.57.b:0 "Too much"

  nf_tnk.59.t:0 "Treaty of Nipton"
  nf_tnk.59.d:0 "[TNK.getName] has taken Shady Sands for now we must make peace or we will not survive never mind the cost."
  nf_tnk.59.a:0 "We will suffer this indignity today"

  nf_tnk.58.t:0 "Treaty of Boulder City"
  nf_tnk.58.d:0 "[TNK.getName] has taken Flagstaff for now we must make peace or we will not survive never mind the cost."
  nf_tnk.58.a:0 "We will suffer this indignity today"

  nf_tnk.62.t:0 "The Broken Mojave"
  nf_tnk.62.d:0 "The Mojave is broken, we rule over a squalid slum squeezed between post-war super-powers. If we are to survive we must rebuild the Mojave, we must clean it of its parasites and we must reorientate it towards a new future."
  nf_tnk.62.a:0 "Almost makes you wish for a nuclear winter..."

  nf_mojave_brotherhood.27.c:0 "§RWe are doomed!§"