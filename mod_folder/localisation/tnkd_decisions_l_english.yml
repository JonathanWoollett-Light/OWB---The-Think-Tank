l_english:
  tnkd_decohesion_decision:0 "Decohesion"
  tnkd_decohesion_decision_desc:0 "WHAT?!? Something went wrong, our consciousnesses are not properly bound, our minds loose cohesion by at each moment."
  tnkd_ncr_reparations_mission:0 "Collecting reparations from [NCR.GetAdjective]"
  tnkd_ncr_reparations_mission_desc:0 "Tribute trains roll west. When this mission expires, the reparations idea is removed — but a fresh demand can refresh the timer."
  tnkd_collect_ncr_reparations:0 "Demand [NCR.GetAdjective] reparations"
  tnkd_collect_ncr_reparations_desc:0 "Take the spoils owed to us by a defeated Republic. Adds an industrial bonus idea for a year, with the option to renew."
  tnkd_extend_ncr_reparations:0 "Press [NCR.GetAdjective] for more reparations"
  tnkd_extend_ncr_reparations_desc:0 "Squeeze the bear for another year of tribute. Resets the reparations timer."

  tnkd_ces_reparations_mission:0 "Collecting reparations from [CES.GetAdjective]"
  tnkd_ces_reparations_mission_desc:0 "Tribute caravans cross the river. When this mission expires, the reparations idea is removed — but a fresh demand can refresh the timer."
  tnkd_collect_ces_reparations:0 "Demand [CES.GetAdjective] reparations"
  tnkd_collect_ces_reparations_desc:0 "Take the spoils owed to us by a defeated Legion. Adds an industrial bonus idea for a year, with the option to renew."
  tnkd_extend_ces_reparations:0 "Press [CES.GetAdjective] for more reparations"
  tnkd_extend_ces_reparations_desc:0 "Squeeze the bull for another year of tribute. Resets the reparations timer."

  tnkd_expedition_ncr:0 "Expedition into [NCR.GetAdjective] territory"
  tnkd_expedition_ncr_desc:0 "A small, deniable survey team crosses the border to recover relics and readings the Republic doesn't know they have. We come back with science, not state."
  tnkd_expedition_ces:0 "Expedition into [CES.GetAdjective] territory"
  tnkd_expedition_ces_desc:0 "Quietly, between cohorts, our agents sift the Legion's ruins for what their cruder hands have overlooked."
  tnkd_expedition_veg:0 "Expedition into [VEG.GetAdjective] territory"
  tnkd_expedition_veg_desc:0 "Vegas is built on what the Old World left lying around. We have nothing against borrowing from the borrowers."

  tnkd_buff_people_popularity:0 "Town Hall Tour"
  tnkd_buff_people_popularity_desc:0 "Walk the wards, listen, nod. The brain-jars will not be loved, but they can be tolerated for a season. +5% Town Hall Democracy popularity."
  tnkd_buff_elites_popularity:0 "Patrons of Industry"
  tnkd_buff_elites_popularity_desc:0 "Quiet meetings with the Mojave's lingering money: protection, contracts, the occasional miracle. +5% Oligarchy popularity."
  tnkd_buff_intellectuals_popularity:0 "Symposium of the Pure"
  tnkd_buff_intellectuals_popularity_desc:0 "We convene every voice in the collective and let consensus emerge by reason alone. +5% Technocracy popularity."
  tnkd_buff_ruler_popularity:0 "By Mobius' Decree"
  tnkd_buff_ruler_popularity_desc:0 "A proclamation in the old voice, broadcast wherever a speaker still works. +5% Militarist Oligarchy popularity."

  tnkd_ncr_warplan_decision:0 "War Plan: [NCR.GetAdjective]"
  tnkd_ncr_warplan_decision_desc:0 "Drill our forces on doctrine tailored for §Y[NCR.getName]§! and stockpile intelligence on their formations. A one-year edge in any engagement with them."
  tnkd_ces_warplan_decision:0 "War Plan: [CES.GetAdjective]"
  tnkd_ces_warplan_decision_desc:0 "Drill our forces on doctrine tailored for §Y[CES.getName]§! and stockpile intelligence on their formations. A one-year edge in any engagement with them."
  tnkd_ncr_peace_deal_mission:0 "Peace talks with [NCR.GetAdjective]"
  tnkd_ncr_peace_deal_mission_desc:0 "Our forces hold §Y[NCR.getName]§!'s heartland. After §Y30§! days the option to broker a peace deal will materialise."
  tnkd_ces_peace_deal_mission:0 "Peace talks with [CES.GetAdjective]"
  tnkd_ces_peace_deal_mission_desc:0 "Our forces hold §Y[CES.getName]§!'s heartland. After §Y30§! days the option to broker a peace deal will materialise."
  tnkd_ingenuity_decision:0 "Ingenuity"
  tnkd_ingenuity_decision_desc:0 "With out newfound focus we can continuously optimize our designs."
  tnkd_ingenuity_decision_tt:0 "Never backward always forward, always.\nAdds §G+1%§! to §YIngenuity§!.\nCancels after reaching +25%."
  
  tnkd_clean_slate_decision_0:0 "Clean Slate Protocol"
  tnkd_clean_slate_decision_1:0 "Clean Slate Protocol"
  tnkd_clean_slate_decision_2:0 "Clean Slate Protocol"
  tnkd_clean_slate_decision_3:0 "Clean Slate Protocol"
  
  tnkd_dna_shattering_decision:0 "Genetic Warfare"
  tnkd_dna_shattering_decision_desc:0 "It doesn't require much cesium to be accidently §glost§! from our labs for an entire city to die."
  
  tnkd_gev_category:0 "G.E.V."
  tnkd_gev_decision:0 "§PG.E.V.§!"
  
  tnkd_resource_consolidation_decision:0 "Resource Consolidation"
  tnkd_resource_consolidation_decision_tt:0 "No owned state has atleast §Y3£resources_strip_texticon|3 §!, §Y1£resources_strip_texticon|4 §!, §Y1£resources_strip_texticon|5 §! or §Y1£resources_strip_texticon|6 §!."
  tnkd_resource_consolidation_decision_metal_tt:0 "Moves production of §Y1£resources_strip_texticon|3 §! to §Y[TNK.capital.GetName]§!."
  tnkd_resource_consolidation_decision_composites_tt:0 "Moves production of §Y1£resources_strip_texticon|4 §! to §Y[TNK.capital.GetName]§!."
  tnkd_resource_consolidation_decision_circuitry_tt:0 "Moves production of §Y1£resources_strip_texticon|5 §! to §Y[TNK.capital.GetName]§!."
  tnkd_resource_consolidation_decision_advanced_tt:0 "Moves production of §Y1£resources_strip_texticon|6 §! to §Y[TNK.capital.GetName]§!."

  tnkd_border_war_category:0 "Border Wars"
  tnkd_ces_border_war_decision:0 "Battle of Weathertop"
  tnkd_ncr_border_war_decision:0 "The Long War"

  tnkd_northern_mojave_industry_mission:0 "Northern Mojave Industry"
  tnkd_northern_mojave_military_mission:0 "Northern Mojave Military"
  tnkd_quarry_junction_mission:0 "Clearing Quarry Junction"
  tnkd_quarry_junction_mission_desc:0 "The deathclaws and other creatures of the quarry junction are a constant threat to the people (and more importantly industry) in the region, we must clear them out."

  tnkd_nipton_mission:0 "The Lessons of Nipton"
  tnkd_nipton_mission_desc:0 "Caesar's Legion made an example of Nipton, decimating the town in a sick lottery of crucifixion and fire. We will bury the dead, rebuild the roads, and show the Mojave a better order than the bull's."
  tnkd_cottonwood_cove_mission:0 "Draining Cottonwood Cove"
  tnkd_cottonwood_cove_mission_desc:0 "The Legion's slaver docks on the Colorado still hold cages full of prisoners. We will free them - every able body is a resource we can put to better use - and dismantle the camp."
  tnkd_route_95_mission:0 "Securing Route 95"
  tnkd_route_95_mission_desc:0 "The highway to Nellis is the artery of the eastern Mojave. Clear the raiders and reopen the road, and trade - and order - will follow."
  tnkd_helios_one_mission:0 "Powering the Mojave"
  tnkd_helios_one_mission_desc:0 "HELIOS One can light up the whole region if its collectors are brought back online for the people rather than hoarded for a weapon. Free power buys a great deal of goodwill."
  tnkd_hidden_valley_mission:0 "Looting Hidden Valley"
  tnkd_hidden_valley_mission_desc:0 "The Brotherhood of Steel buried themselves in their bunker and then buried themselves in the sand. Their hoarded technology is wasted on the dead - we will put it to use."
  tnkd_black_mountain_mission:0 "Silencing Black Mountain"
  tnkd_black_mountain_mission_desc:0 "The nightkin of Black Mountain broadcast Tabitha's deranged sermons across the wasteland. We will take the transmitter and replace the madness with something useful."