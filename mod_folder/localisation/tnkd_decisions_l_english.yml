  tnkd_ces_border_war_decision:0 "Battle of Weathertop"
  tnkd_ncr_border_war_decision:0 "The Long War"

  tnkd_northern_mojave_industry_mission:0 "Northern Mojave Industry"
  tnkd_northern_mojave_military_mission:0 "Northern Mojave Military"
  tnkd_quarry_junction_mission:0 "Clearing Quarry Junction"
  tnkd_quarry_junction_mission_desc:0 "The deathclaws and other creatures of the quarry junction are a constant threat to the people (and more importantly industry) in the region, we must clear them out."

  tnkd_nipton_mission:0 "The Lessons of Nipton"
  tnkd_nipton_mission_desc:0 "Caesar's Legion made an example of Nipton, decimating the town in a sick lottery of crucifixion and fire. We will bury the dead, rebuild the roads, and show the Mojave a better order than the bull's."
  tnkd_cottonwood_cove_mission:0 "Draining Cottonwood Cove"
  tnkd_cottonwood_cove_mission_desc:0 "The Legion's slaver docks on the Colorado still hold cages full of prisoners. We will free them - every able body is a resource we can put to better use - and dismantle the camp."
  tnkd_route_95_mission:0 "Securing Route 95"
  tnkd_route_95_mission_desc:0 "The highway to Nellis is the artery of the eastern Mojave. Clear the raiders and reopen the road, and trade - and order - will follow."
  tnkd_helios_one_mission:0 "Powering the Mojave"
  tnkd_helios_one_mission_desc:0 "HELIOS One can light up the whole region if its collectors are brought back online for the people rather than hoarded for a weapon. Free power buys a great deal of goodwill."
  tnkd_hidden_valley_mission:0 "Looting Hidden Valley"
  tnkd_hidden_valley_mission_desc:0 "The Brotherhood of Steel buried themselves in their bunker and then buried themselves in the sand. Their hoarded technology is wasted on the dead - we will put it to use."
  tnkd_black_mountain_mission:0 "Silencing Black Mountain"
  tnkd_black_mountain_mission_desc:0 "The nightkin of Black Mountain broadcast Tabitha's deranged sermons across the wasteland. We will take the transmitter and replace the madness with something useful."